openapi: 3.0.3
info:
  title: GoChat API
  description: >
    Production-ready real-time chat API built with Go, PostgreSQL (sqlc + pgx), RabbitMQ, and WebSockets.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

security: []

paths:
  /api/healthz:
    get:
      summary: Health Check
      description: Returns the operational health status of the API server.
      responses:
        '200':
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /api/users:
    post:
      summary: Create User Account
      description: Registers a new user with nickname, email, and password. Sends a verification email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '400':
          description: Bad request (invalid JSON or password hashing error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (user with email already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update Authenticated User
      description: Updates the authenticated user's nickname, email, or password.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request (invalid JSON or missing update fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (email already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete User Account
      description: Deletes active sessions and anonymizes the authenticated user's account.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User account anonymized/deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/login:
    post:
      summary: User Login
      description: Authenticates user credentials. Returns JWT access token and sets an HttpOnly refresh token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=abc123raw...; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=5184000
              description: HttpOnly cookie containing raw refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        '400':
          description: Bad request (invalid JSON payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (incorrect credentials or unverified account)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (account registered via social provider)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/refresh:
    post:
      summary: Refresh Access Token
      description: Issues a new JWT access token using the HttpOnly `refresh_token` cookie.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: New access token issued successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                properties:
                  token:
                    type: string
                    description: JWT access token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Unauthorized (missing, invalid, or expired refresh token cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/logout:
    post:
      summary: User Logout
      description: Revokes the user session associated with the `refresh_token` cookie and clears the cookie.
      security:
        - CookieAuth: []
      responses:
        '204':
          description: Logout successful. Refresh cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=; Path=/; Max-Age=-1; HttpOnly; Secure; SameSite=Strict
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/verify:
    post:
      summary: Verify User Email
      description: Verifies account ownership using token sent via email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserVerifyRequest'
      responses:
        '200':
          description: Account verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad request (invalid format or missing token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (token invalid or expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/oauth/github/login:
    get:
      summary: Initiate GitHub OAuth Login
      description: Sets `oauthstate` cookie and redirects user to GitHub's OAuth authorization page.
      responses:
        '307':
          description: Temporary redirect to GitHub OAuth page

  /api/oauth/github/callback:
    get:
      summary: GitHub OAuth Callback
      description: Handles redirect back from GitHub, exchanges code for access token, authenticates/creates user, and redirects to frontend with token fragment.
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: OAuth state parameter for CSRF protection
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: Authorization code returned by GitHub
      responses:
        '302':
          description: Found (redirect to frontend callback URL with access_token fragment)
        '400':
          description: Bad request (missing state or code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (invalid OAuth state mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chats:
    get:
      summary: Get User Chats
      description: Retrieves all chats (inbox) for the authenticated user, including last message preview.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user chats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInboxResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create Chat
      description: Creates a new 1-on-1 or group chat. Returns existing chat ID if 1-on-1 chat already exists between users.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '200':
          description: 1-on-1 chat already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  message:
                    type: string
                    example: Chat already exists
        '400':
          description: Bad request (invalid input or 1-on-1 chat doesn't have 2 participants)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chats/{id}/messages:
    get:
      summary: Get Chat Messages
      description: Fetches recent messages for a chat with optional pagination using `before_id`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the chat
        - in: query
          name: before_id
          required: false
          schema:
            type: string
            format: uuid
          description: Message UUID cursor for fetching older messages
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesResponse'
        '400':
          description: Bad request (invalid chat ID or before_id UUID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (user does not belong to chat)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/messages:
    post:
      summary: Send Message
      description: Sends a new message to a chat and broadcasts it via RabbitMQ pub/sub.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message created and broadcasted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Bad request (invalid JSON payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/messages/{id}:
    patch:
      summary: Update Message Content
      description: Edits the text content of a message sent by the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the message to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
      responses:
        '200':
          description: Message updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  content:
                    type: string
                  sender_id:
                    type: string
                    format: uuid
                  chat_id:
                    type: string
                    format: uuid
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Bad request (invalid JSON or message ID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (authenticated user did not send this message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sessions:
    get:
      summary: List Active Sessions
      description: Lists active refresh token sessions for the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sessions/{id}:
    delete:
      summary: Revoke Session
      description: Revokes a specific active session by session UUID.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the session to revoke
      responses:
        '204':
          description: Session revoked successfully
        '400':
          description: Bad request (invalid session ID UUID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ws:
    get:
      summary: Real-Time WebSocket Connection
      description: Establishes a persistent WebSocket connection for receiving real-time chat push notifications. Requires HTTP connection upgrade.
      security:
        - BearerAuth: []
      responses:
        '101':
          description: Switching Protocols to WebSocket
          headers:
            Upgrade:
              schema:
                type: string
                example: websocket
            Connection:
              schema:
                type: string
                example: Upgrade
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token passed in the Authorization header (`Authorization: Bearer <token>`).
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly cookie containing the raw refresh token (`refresh_token=<token>`).

  schemas:
    UserCreateRequest:
      type: object
      required:
        - nickname
        - password
        - email
      properties:
        nickname:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: Password123!
        email:
          type: string
          format: email
          example: alice@example.com

    UserCreateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0190e241-7c9b-789a-8123-456789abcdef
        nickname:
          type: string
          example: alice
        status:
          type: string
          example: unverified
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        email:
          type: string
          format: email
          example: alice@example.com

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        email:
          type: string
          format: email

    UserLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: Password123!

    UserLoginResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        email:
          type: string
          format: email
        token:
          type: string
          description: JWT access token

    UserUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
          example: alice_updated
        password:
          type: string
          format: password
          nullable: true
          example: NewPassword123!
        email:
          type: string
          format: email
          nullable: true
          example: newalice@example.com

    UserVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: verify_token_12345

    Chat:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0190e241-7c9b-789a-8123-456789abcdef
        name:
          type: string
          nullable: true
          example: Team Chat
        is_group:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    CreateChatRequest:
      type: object
      required:
        - is_group
        - participant_ids
      properties:
        name:
          type: string
          nullable: true
          example: Project Alpha
        is_group:
          type: boolean
          example: false
        participant_ids:
          type: array
          items:
            type: string
            format: uuid
          example:
            - 0190e241-7c9b-789a-8123-456789abcdef

    ChatInboxItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        is_group:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_read_at:
          type: string
          format: date-time
        last_message_content:
          type: string
          nullable: true
        last_message_id:
          type: string
          format: uuid
          nullable: true

    ChatInboxResponse:
      type: array
      items:
        $ref: '#/components/schemas/ChatInboxItem'

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
          example: Hello world!
        sender_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    SendMessageRequest:
      type: object
      required:
        - chat_id
        - message
      properties:
        chat_id:
          type: string
          format: uuid
        message:
          type: string
          example: Hello there!

    UpdateMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: Updated message text

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        user_agent:
          type: string
          example: Mozilla/5.0...
        ip_address:
          type: string
          example: 127.0.0.1

    SessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Error description message
